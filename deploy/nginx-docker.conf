# ============================================================
# 校园综合服务平台 —— Nginx 容器版配置（docker-compose 的 web 服务用）
# 与 deploy/nginx-campus.conf 规则一致，差异：
#   1. 后端地址为 compose 服务名 api:8001（容器网络内解析）
#   2. 前端产物在 /usr/share/nginx/html
#   3. /ws 关闭 access_log：WebSocket token 走 query 参数，
#      记日志等于把用户令牌写进磁盘
# ============================================================

server {
    listen 80;
    server_name _;

    # 简历 PDF 上传：后端限制 10MB，这里放宽到 20MB
    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    # ---------------- 前端 SPA ----------------
    location / {
        # Vue Router history 模式：刷新子路径必须回落 index.html
        try_files $uri $uri/ /index.html;
    }

    # Vite 构建产物带内容 hash，长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------------- 后端 API ----------------
    location /api/ {
        proxy_pass http://api:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 必须关缓冲，否则流式变「攒 20 秒整段蹦出」
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;

        # 必须大于 LLM 单次调用超时（120s）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---------------- 后端静态文件 ----------------
    location /static/ {
        proxy_pass http://api:8001;
        proxy_set_header Host $host;
        expires 1h;
    }

    # ---------------- WebSocket 私信 ----------------
    location /ws {
        proxy_pass http://api:8001;
        proxy_http_version 1.1;

        # WebSocket 必须转发 Upgrade 头
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;

        # token 在 query 里，关闭访问日志避免令牌落盘
        access_log off;

        # 长连接读超时给足余量（前端 25s ping 保活）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
