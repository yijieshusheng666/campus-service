# ============================================================
# 校园综合服务平台 —— HTTPS 站点配置（模板）
# 放置路径：/etc/nginx/conf.d/campus.conf （替换现有 HTTP 版）
#
# 使用前必做（阿里云国内 ECS）：
#   1. 注册一个域名（阿里云万网即可，.top/.xyz 首年约 10 元）
#   2. 域名完成 ICP 备案（阿里云 App 提交，约 1-3 周）—— 不备案，
#      域名解析到国内 ECS 的 80/443 会被阿里云拦截，这是法规要求
#   3. 域名 A 记录解析到 116.62.243.122
#   4. 申请免费证书（二选一）：
#      a) certbot 自动申请：
#         sudo apt install certbot python3-certbot-nginx
#         sudo certbot --nginx -d 你的域名
#         （certbot 会自动改写本文件的 ssl_certificate 路径并配好续期）
#      b) 阿里云控制台「SSL 证书」申请免费版，下载 nginx 格式，
#         把 .pem/.key 放到 /etc/nginx/ssl/ 并按下面路径填
#   5. 把本文件里 campus.example.com 全部替换成你的真实域名
#
# 备案下来之前的过渡方案：继续用 HTTP + IP 访问，答辩演示不受影响。
# ============================================================

# 80 端口只做一件事：跳转 HTTPS
server {
    listen 80;
    server_name campus.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name campus.example.com;

    # ---- 证书路径（certbot 申请的话它会自动填成 /etc/letsencrypt/live/域名/ 下）----
    ssl_certificate     /etc/nginx/ssl/campus.example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/campus.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 简历 PDF 上传：后端限制 10MB，这里放宽到 20MB
    client_max_body_size 20m;

    root /var/www/campus/dist;
    index index.html;

    access_log /var/log/nginx/campus.access.log;
    error_log  /var/log/nginx/campus.error.log;

    # 安全响应头
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # ---------------- 前端 SPA ----------------
    location / {
        # Vue Router history 模式：刷新子路径必须回落 index.html
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------------- 后端 API ----------------
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 必须关缓冲，否则流式变「攒 20 秒整段蹦出」
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;

        # 必须大于 LLM 单次调用超时（120s）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---------------- 后端静态文件 ----------------
    location /static/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        expires 1h;
    }

    # ---------------- WebSocket 私信 ----------------
    location /ws {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;

        # WebSocket 必须转发 Upgrade 头
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;

        # token 在 query 里，关闭访问日志避免令牌落盘
        access_log off;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
