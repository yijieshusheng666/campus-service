# ============================================================
# 校园综合服务平台 —— Nginx 站点配置
# 放置路径：/etc/nginx/conf.d/campus.conf
#
# 四个 location 的分工：
#   /        前端构建产物 dist/（Vue SPA，history 路由需要 fallback）
#   /api/    后端 FastAPI
#   /static/ 后端挂载的商品图 / 简历文件
#   /ws      WebSocket 私信
#
# 这个文件里有两处「不写就出玄学 bug」的配置，见下方注释。
# ============================================================

server {
    listen 80;
    server_name _;

    # 简历 PDF 上传：后端限制 10MB（MAX_UPLOAD_SIZE_MB），
    # 这里放宽到 20MB，避免 Nginx 先拦下来返回 413、而后端日志里什么都看不到
    client_max_body_size 20m;

    root /var/www/campus/dist;
    index index.html;

    access_log /var/log/nginx/campus.access.log;
    error_log  /var/log/nginx/campus.error.log;

    # ---------------- 前端 SPA ----------------
    location / {
        # 关键：Vue Router 用 history 模式，刷新 /goods/12 这类地址时
        # 服务器上并没有这个文件，必须回落到 index.html 交给前端路由，
        # 否则用户一刷新就 404
        try_files $uri $uri/ /index.html;
    }

    # Vite 构建产物带内容 hash，可以放心长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------------- 后端 API ----------------
    location /api/ {
        # proxy_pass 不带 URI，原样透传路径：/api/v1/goods -> 127.0.0.1:8001/api/v1/goods
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ★★ 关键 1：SSE 必须关缓冲 ★★
        # AI 模拟面试是 text/event-stream 流式返回。Nginx 默认会开启响应缓冲，
        # 把内容攒够一个缓冲区大小才转发，结果就是「流式」变成「等 20 秒然后整段蹦出来」，
        # 前端做的打字机效果彻底失效。下面三行去掉缓冲。
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;

        # LLM 单次调用超时是 120s（见 app/services/llm.py:20），
        # 代理读超时必须大于它，否则长回答会被 Nginx 提前切断返回 504
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---------------- 后端静态文件 ----------------
    location /static/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        # 商品图和简历会被前端反复请求（页面来回切换），缓存 1 小时
        expires 1h;
    }

    # ---------------- WebSocket 私信 ----------------
    location /ws {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;

        # ★★ 关键 2：WebSocket 必须转发 Upgrade 头 ★★
        # 少了这两行，Nginx 会按普通 HTTP 处理，握手直接失败，
        # 浏览器控制台表现为「WebSocket connection failed」，聊天功能整体不可用。
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;

        # 长连接不能被默认 60s 读超时掐断（前端每 25s 发一次 ping 保活，
        # 这里给足余量，避免用户挂着聊天页每隔一分钟就掉线重连）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
